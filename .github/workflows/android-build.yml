name: Android release build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free space for the native build
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if [[ -d "${ANDROID_HOME}/ndk" ]]; then
            sudo find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 \
              ! -name '27.2.12479018' -exec rm -rf {} +
          fi
          df -h /

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android native toolchain
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" 'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.10.2.4988404'

      - name: Prepare signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore='TMessagesProj/config/release.keystore'

          test -n "${RELEASE_KEYSTORE_BASE64}"
          test -n "${RELEASE_STORE_PASSWORD}"
          test -n "${RELEASE_KEY_ALIAS}"
          test -n "${RELEASE_KEY_PASSWORD}"

          echo "::add-mask::${RELEASE_STORE_PASSWORD}"
          echo "::add-mask::${RELEASE_KEY_PASSWORD}"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          keytool -list \
            -keystore "${keystore}" \
            -storepass "${RELEASE_STORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" >/dev/null
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build the universal release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -PRELEASE_STORE_PASSWORD="${ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD}" \
            -PRELEASE_KEY_ALIAS="${ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS}" \
            -PRELEASE_KEY_PASSWORD="${ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD}" \
            --no-daemon --max-workers=2 --stacktrace

      - name: Collect APK and SHA-256
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/.*PARTISAN_VERSION_STRING = "\([^"]*\)".*/\1/p' \
            TMessagesProj/src/main/java/org/telegram/messenger/partisan/PartisanVersion.java)
          apk=$(find TMessagesProj_App -type f -name app.apk \
            -path '*/afat/release/*' -print -quit)
          test -n "${version}"
          test -n "${apk}"
          mkdir -p dist
          cp "${apk}" "dist/RGram-${version}.apk"
          cd dist
          sha256sum "RGram-${version}.apk" \
            > "RGram-${version}.apk.sha256"
          cat "RGram-${version}.apk.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RGram-build-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.apk dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "RGram ${GITHUB_REF_NAME#v}"
